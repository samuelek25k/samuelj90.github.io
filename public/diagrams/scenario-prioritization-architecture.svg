<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <!-- Crisp shadow for cards -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ae3ec9"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3b5bdb"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="16"/>

  <!-- Brand Banner (Canonical Header) -->
  <g transform="translate(36, 24)">
    <rect width="888" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#header-grad)"/>
    <text x="32" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">S</text>
    
    <text x="62" y="33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#0F172A">@samuelj90</text>
    <text x="62" y="48" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B">Build • Automate • Innovate</text>

    <text x="460" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A">Autonomous Scenario Prioritization</text>
    <text x="460" y="50" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Intent Triage • Hierarchical Precedence • Deterministic Validation</text>

    <!-- Technology Tag -->
    <g transform="translate(770, 16)">
      <rect width="104" height="32" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="52" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#1D4ED8">AI ARCHITECTURE</text>
    </g>
  </g>

  <!-- COLUMN 1: INTENT & SCOPE -->
  <g transform="translate(36, 110)" filter="url(#soft-shadow)">
    <!-- Main Box -->
    <rect width="268" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header Badge -->
    <rect x="20" y="20" width="228" height="32" rx="6" fill="#ae3ec9"/>
    <text x="134" y="41" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">STAGE 1: INTENT &amp; SCOPE</text>

    <text x="134" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#1E293B">Scope Check &amp; Routing</text>

    <!-- Item 1 -->
    <rect x="18" y="105" width="232" height="60" rx="8" fill="#FDF4FF" stroke="#F0ABFC" stroke-width="1"/>
    <text x="30" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#86198F">• Intent Clarification</text>
    <text x="30" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A21CAF">`interview-me`</text>
    <text x="130" y="148" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#701A75">(pre-decision)</text>

    <!-- Item 2 -->
    <rect x="18" y="180" width="232" height="60" rx="8" fill="#FDF4FF" stroke="#F0ABFC" stroke-width="1"/>
    <text x="30" y="203" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#86198F">• Capability Isolation</text>
    <text x="30" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A21CAF">`spec-driven-dev`</text>
    <text x="150" y="223" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#701A75">(phase 0)</text>

    <!-- Item 3 -->
    <rect x="18" y="255" width="232" height="60" rx="8" fill="#FDF4FF" stroke="#F0ABFC" stroke-width="1"/>
    <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#86198F">• Context Budgeting</text>
    <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A21CAF">`context-engineering`</text>

    <!-- Footnote -->
    <text x="134" y="355" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-size="11" fill="#9333EA">Clarify ambiguity before coding</text>
  </g>

  <!-- Flow 1 -> 2 Arrow -->
  <g transform="translate(304, 305)">
    <path d="M 0 0 L 34 0" fill="none" stroke="#ae3ec9" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
    <rect x="-8" y="-24" width="56" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="-11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" fill="#ae3ec9">TRIAGE</text>
  </g>

  <!-- COLUMN 2: PRECEDENCE TIERS -->
  <g transform="translate(346, 110)" filter="url(#soft-shadow)">
    <!-- Main Box -->
    <rect width="268" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Badge -->
    <rect x="20" y="20" width="228" height="32" rx="6" fill="#3b5bdb"/>
    <text x="134" y="41" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">STAGE 2: PRECEDENCE TIERS</text>

    <text x="134" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#1E293B">Hierarchy &amp; Governance</text>

    <!-- Tier 1 -->
    <rect x="18" y="105" width="232" height="60" rx="8" fill="#FEF2F2" stroke="#F87171" stroke-width="1.2"/>
    <text x="30" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="11.5" fill="#991B1B">T1: Safety &amp; Invariants</text>
    <text x="30" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#DC2626">`security-and-hardening`</text>

    <!-- Tier 2 -->
    <rect x="18" y="180" width="232" height="60" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.2"/>
    <text x="30" y="203" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="11.5" fill="#1E40AF">T2: Core Task Execution</text>
    <text x="30" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563EB">`test-driven-development`</text>

    <!-- Tier 3 -->
    <rect x="18" y="255" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.2"/>
    <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="11.5" fill="#166534">T3: Presentation &amp; Style</text>
    <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="10" fill="#16A34A">`documentation-and-adrs`</text>

    <!-- Footnote -->
    <text x="134" y="355" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-weight="600" font-size="11" fill="#DC2626">T1 unconditionally dominates T2 &amp; T3</text>
  </g>

  <!-- Flow 2 -> 3 Arrow -->
  <g transform="translate(614, 305)">
    <path d="M 0 0 L 34 0" fill="none" stroke="#3b5bdb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="-8" y="-24" width="56" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="-11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" fill="#3b5bdb">CONTRACT</text>
  </g>

  <!-- COLUMN 3: VERIFICATION GATES -->
  <g transform="translate(656, 110)" filter="url(#soft-shadow)">
    <!-- Main Box -->
    <rect width="268" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Badge -->
    <rect x="20" y="20" width="228" height="32" rx="6" fill="#0ca678"/>
    <text x="134" y="41" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">STAGE 3: VERIFICATION</text>

    <text x="134" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#1E293B">Conflict Matrix Gates</text>

    <!-- Item 1 -->
    <rect x="18" y="105" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Conflict Matrix Checks</text>
    <text x="30" y="148" font-family="'Inter', system-ui, sans-serif" font-size="10" fill="#15803D">Adversarial Rule Assertions</text>

    <!-- Item 2 -->
    <rect x="18" y="180" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="203" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Zero-Token Git Hook</text>
    <text x="30" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">pre-commit AST validation</text>

    <!-- Item 3 -->
    <rect x="18" y="255" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Release Readiness</text>
    <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">`shipping-and-launch`</text>

    <!-- Footnote -->
    <text x="134" y="355" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-size="11" fill="#059669">Zero regression across releases</text>
  </g>

  <!-- Bottom Invariant Banner -->
  <g transform="translate(36, 520)">
    <rect width="888" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <text x="30" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#0F172A">CONTINUOUS PRECEDENCE INVARIANT:</text>
    <text x="315" y="36" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#475569">Dynamic context changes trigger re-evaluation across all 3 tiers. Safety (T1) remains immutable.</text>
  </g>
</svg>
