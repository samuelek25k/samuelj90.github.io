<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="vault-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="16"/>

  <!-- Brand Banner -->
  <g transform="translate(32, 28)">
    <rect width="856" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="url(#header-grad)"/>
    <text x="30" y="36" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">S</text>
    
    <text x="56" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#0F172A">@samuelj90</text>
    <text x="56" y="48" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748B">Build • Automate • Innovate</text>

    <text x="440" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17" fill="#0F172A">PII Protection with LLMs</text>
    <text x="440" y="49" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748B">Zero-Leakage Privacy Proxy • In-Memory Ephemeral Mappings</text>

    <!-- Shield Badge -->
    <g transform="translate(800, 14)">
      <circle cx="16" cy="16" r="16" fill="#EFF6FF"/>
      <path d="M16 6 L24 10 V16 C24 21 16 26 16 26 C16 26 8 21 8 16 V10 Z" fill="#0284c7"/>
      <path d="M14 16 L16 18 L20 13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- STEP 1: User Input & Detection -->
  <g transform="translate(32, 108)" filter="url(#soft-shadow)">
    <rect width="260" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#0284c7"/>
    <text x="24" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">1</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A">Raw User Prompt</text>
    
    <rect x="14" y="46" width="232" height="74" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="24" y="68" font-family="'JetBrains Mono', monospace" font-size="11" fill="#334155">"My email is</text>
    <text x="96" y="68" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#0284c7">john@gmail.com</text>
    <text x="24" y="86" font-family="'JetBrains Mono', monospace" font-size="11" fill="#334155">and phone is</text>
    <text x="24" y="104" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#059669">555-123-4567"</text>
  </g>

  <!-- Flow 1 -> 2 Arrow -->
  <path d="M 292 175 L 328 175" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- STEP 2: Masking & Tokenization -->
  <g transform="translate(330, 108)" filter="url(#soft-shadow)">
    <rect width="260" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#0284c7"/>
    <text x="24" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">2</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A">Regex Token Masker</text>

    <rect x="14" y="46" width="232" height="74" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="24" y="68" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">john@gmail.com →</text>
    <text x="135" y="68" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#7C3AED">&lt;EMAIL_1&gt;</text>
    <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1E293B">555-123-4567   →</text>
    <text x="135" y="90" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#7C3AED">&lt;PHONE_1&gt;</text>
    <text x="24" y="110" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#059669">✓ Synthetic tokens created</text>
  </g>

  <!-- Flow 2 -> 3 Arrow (Down to Memory Vault) -->
  <path d="M 460 243 L 460 270 L 626 270 L 626 175" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-emerald)"/>

  <!-- STEP 3: Local Ephemeral Vault -->
  <g transform="translate(628, 108)" filter="url(#soft-shadow)">
    <rect width="260" height="135" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.8"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="url(#vault-grad)"/>
    <text x="24" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">3</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#065F46">Local Encrypted Vault</text>

    <rect x="14" y="46" width="232" height="74" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46">{"&lt;EMAIL_1&gt;": "john@..."}</text>
    <text x="24" y="82" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46">{"&lt;PHONE_1&gt;": "555-..."}</text>
    <text x="24" y="104" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="10" fill="#DC2626">🔒 Stays local — NEVER sent to LLM</text>
  </g>

  <!-- Flow 2 -> 4 Arrow (Down to LLM) -->
  <path d="M 460 243 L 460 300" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- STEP 4: Cloud LLM Inference (Groq/OpenAI) -->
  <g transform="translate(330, 302)" filter="url(#soft-shadow)">
    <rect width="260" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#0284c7"/>
    <text x="24" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">4</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A">Cloud LLM (e.g. Groq)</text>

    <rect x="14" y="46" width="232" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="66" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">Prompt Received by LLM:</text>
    <text x="24" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0F172A">"My email is &lt;EMAIL_1&gt;</text>
    <text x="24" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#0F172A">and phone is &lt;PHONE_1&gt;"</text>
    <text x="24" y="114" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#059669">0% Personal Data Exposure</text>
  </g>

  <!-- Flow 4 -> 5 Arrow (Down to LLM Response) -->
  <path d="M 460 437 L 460 470" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- STEP 5: LLM Response with Tokens -->
  <g transform="translate(330, 472)" filter="url(#soft-shadow)">
    <rect width="260" height="115" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#0284c7"/>
    <text x="24" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">5</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#0F172A">Masked LLM Answer</text>

    <rect x="14" y="46" width="232" height="55" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">"Reset link sent to &lt;EMAIL_1&gt;.</text>
    <text x="24" y="84" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">Verify via &lt;PHONE_1&gt;."</text>
  </g>

  <!-- Flow 5 -> 6 Arrow (Left to Unmasking) -->
  <path d="M 330 530 L 292 530" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Vault connection to Unmasker -->
  <path d="M 758 243 L 758 530 L 628 530" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 628 530 L 292 530" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- STEP 6: Unmasker & Clean Output -->
  <g transform="translate(32, 472)" filter="url(#soft-shadow)">
    <rect width="260" height="115" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <rect x="12" y="12" width="24" height="24" rx="6" fill="url(#vault-grad)"/>
    <text x="24" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">6</text>
    <text x="44" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#065F46">Final Unmasked Response</text>

    <rect x="14" y="46" width="232" height="55" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="24" y="66" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46">"Reset link sent to john@gmail.com.</text>
    <text x="24" y="84" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065F46">Verify via 555-123-4567."</text>
  </g>

  <!-- Footer Metadata -->
  <text x="460" y="605" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">
    Privacy First • Secure by Design • Built by @samuelj90
  </text>
</svg>
