<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <!-- Crisp shadow for cards -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ca678"/>
      <stop offset="100%" stop-color="#099268"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0ca678"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4263eb"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="100%" height="100%" fill="#F8FAFC" rx="16"/>

  <!-- Brand Banner (Canonical Header) -->
  <g transform="translate(36, 24)">
    <rect width="888" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#header-grad)"/>
    <text x="32" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF">S</text>
    
    <text x="62" y="33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#0F172A">@samuelj90</text>
    <text x="62" y="48" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748B">Build • Automate • Innovate</text>

    <text x="460" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#0F172A">The Three-Loop AI Engineering Harness</text>
    <text x="460" y="50" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Isolating Project, Feature, and Task Loops with Zero-Token Gates</text>

    <!-- Technology Tag -->
    <g transform="translate(770, 16)">
      <rect width="104" height="32" rx="6" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <text x="52" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#065F46">CORE HARNESS</text>
    </g>
  </g>

  <!-- LOOP 1: PROJECT LOOP -->
  <g transform="translate(36, 110)" filter="url(#soft-shadow)">
    <rect width="268" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header Badge -->
    <rect x="20" y="20" width="228" height="32" rx="6" fill="#0ca678"/>
    <text x="134" y="41" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">LOOP 1: PROJECT LOOP</text>

    <text x="134" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#1E293B">Repo Governance &amp; Context</text>

    <!-- Item 1 -->
    <rect x="18" y="105" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Invariant Rules</text>
    <text x="30" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">AGENTS.md &amp; repo boundaries</text>

    <!-- Item 2 -->
    <rect x="18" y="180" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="203" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Context Engineering</text>
    <text x="30" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">`context-engineering`</text>

    <!-- Item 3 -->
    <rect x="18" y="255" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Clean Git Author State</text>
    <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">`git-workflow-and-versioning`</text>

    <!-- Footnote -->
    <text x="134" y="355" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-size="11" fill="#0ca678">Persistent state outside prompt</text>
  </g>

  <!-- Flow 1 -> 2 Arrow -->
  <g transform="translate(304, 305)">
    <path d="M 0 0 L 34 0" fill="none" stroke="#0ca678" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
    <rect x="-8" y="-24" width="56" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="-11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" fill="#0ca678">SPEC SCOPE</text>
  </g>

  <!-- LOOP 2: FEATURE LOOP -->
  <g transform="translate(346, 110)" filter="url(#soft-shadow)">
    <rect width="268" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Badge -->
    <rect x="20" y="20" width="228" height="32" rx="6" fill="#4263eb"/>
    <text x="134" y="41" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">LOOP 2: FEATURE LOOP</text>

    <text x="134" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#1E293B">Spec &amp; Planning Contracts</text>

    <!-- Item 1 -->
    <rect x="18" y="105" width="232" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="30" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#1E40AF">• Specification First</text>
    <text x="30" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563EB">`spec-driven-development`</text>

    <!-- Item 2 -->
    <rect x="18" y="180" width="232" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="30" y="203" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#1E40AF">• Task Decomposition</text>
    <text x="30" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563EB">`references/planning.md`</text>

    <!-- Item 3 -->
    <rect x="18" y="255" width="232" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#1E40AF">• Execution Target</text>
    <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="10" fill="#2563EB">`tasks/todo.md` contracts</text>

    <!-- Footnote -->
    <text x="134" y="355" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-weight="600" font-size="11" fill="#2563EB">Pre-implementation alignment</text>
  </g>

  <!-- Flow 2 -> 3 Arrow -->
  <g transform="translate(614, 305)">
    <path d="M 0 0 L 34 0" fill="none" stroke="#4263eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
    <rect x="-8" y="-24" width="56" height="18" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="-11" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" fill="#4263eb">TASKS</text>
  </g>

  <!-- LOOP 3: TASK LOOP -->
  <g transform="translate(656, 110)" filter="url(#soft-shadow)">
    <rect width="268" height="390" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Header Badge -->
    <rect x="20" y="20" width="228" height="32" rx="6" fill="#2b8a3e"/>
    <text x="134" y="41" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" letter-spacing="0.5">LOOP 3: TASK LOOP</text>

    <text x="134" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#1E293B">Deterministic Execution Gates</text>

    <!-- Item 1 -->
    <rect x="18" y="105" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="128" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Atomic Mutations</text>
    <text x="30" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">`incremental-implementation`</text>

    <!-- Item 2 -->
    <rect x="18" y="180" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="203" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Test-Driven Red/Green</text>
    <text x="30" y="223" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">`test-driven-development`</text>

    <!-- Item 3 -->
    <rect x="18" y="255" width="232" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="30" y="278" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="11.5" fill="#166534">• Root-Cause Recovery</text>
    <text x="30" y="298" font-family="'JetBrains Mono', monospace" font-size="10" fill="#15803D">`debugging-and-error-recovery`</text>

    <!-- Footnote -->
    <text x="134" y="355" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-style="italic" font-size="11" fill="#15803D">Zero-token pre-commit validation</text>
  </g>

  <!-- Bottom Feedback Loop Banner -->
  <g transform="translate(36, 520)">
    <rect width="888" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-shadow)"/>
    <text x="30" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#0F172A">DETERMINISTIC FEEDBACK LOOP:</text>
    <text x="260" y="36" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#475569">Pre-commit gates enforce AST compliance and</text>
    <text x="560" y="36" font-family="'JetBrains Mono', monospace" font-size="11" fill="#166534">`code-review-and-quality`</text>
    <text x="765" y="36" font-family="'Inter', system-ui, sans-serif" font-size="11.5" fill="#475569">before merge.</text>
  </g>
</svg>
