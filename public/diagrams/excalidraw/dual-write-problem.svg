<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="100%" height="100%">
  <defs>
    <filter id="rough-paper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0ca678"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e03131"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

  <!-- Service Box -->
  <g filter="url(#rough-paper)">
    <rect x="40" y="50" width="180" height="180" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5" />
    <text x="130" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#0f766e">Order Service</text>
    <text x="130" y="115" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#115e59">(Local Business Logic)</text>
    
    <rect x="58" y="140" width="144" height="60" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5" />
    <text x="130" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0f766e">createOrder()</text>
    <text x="130" y="185" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">state + event</text>
  </g>

  <!-- Arrow to DB -->
  <path d="M 220 100 Q 290 85 360 85" fill="none" stroke="#0ca678" stroke-width="2.5" marker-end="url(#arrow-emerald)" filter="url(#rough-paper)"/>
  <text x="290" y="75" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#0ca678">1. Commit State [OK]</text>

  <!-- Database Box -->
  <g filter="url(#rough-paper)">
    <rect x="370" y="45" width="190" height="85" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="2" />
    <text x="465" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="15" fill="#0ca678">PostgreSQL DB</text>
    <text x="465" y="105" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#2b8a3e">Order Record Stored</text>
  </g>

  <!-- Arrow to Kafka (Network Failure) -->
  <path d="M 220 180 Q 290 205 360 205" fill="none" stroke="#e03131" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-rose)" filter="url(#rough-paper)"/>
  <text x="290" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11" fill="#e03131">2. Network Crash [FAIL]</text>

  <!-- Kafka Box -->
  <g filter="url(#rough-paper)">
    <rect x="370" y="160" width="190" height="85" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="2" />
    <text x="465" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="15" fill="#c92a2a">Apache Kafka</text>
    <text x="465" y="220" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12" fill="#e03131">Message Dropped / Lost!</text>
  </g>
</svg>
